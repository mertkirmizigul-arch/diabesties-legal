<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diabesties — Yasal</title>
<style>
  :root { --bg:#fff; --text:#1c2029; --muted:#5b6270; --accent:#4d63ff; --border:#e6e8ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12131c; --text:#f0f1f5; --muted:#9aa0b0; --accent:#7d90ff; --border:#262a3d; }
  }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:64px 20px; text-align:center; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 32px; }
  .links { display:flex; flex-direction:column; gap:12px; }
  a.card {
    display:block; text-decoration:none; color:var(--text);
    border:1px solid var(--border); border-radius:12px; padding:16px 20px;
    font-weight:600;
  }
  a.card span { display:block; font-weight:400; color:var(--muted); font-size:13px; margin-top:2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Diabesties</h1>
  <p>Yasal belgeler</p>
  <div class="links">
    <a class="card" href="./privacy.html">Gizlilik Politikası<span>Kişisel verilerinizi nasıl işlediğimiz</span></a>
    <a class="card" href="./terms.html">Kullanım Koşulları<span>Uygulamayı kullanım şartları</span></a>
  </div>
</div>
</body>
</html>
